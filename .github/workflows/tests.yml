name: Python regression tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [windows, raspberry_pi]
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/online_unified/requirements-online.txt
      - run: python -m pip install -r online_unified/requirements-online.txt
      - run: python ../scripts/verify_repo.py
      - run: python -m unittest discover -p 'test_*.py' -v
